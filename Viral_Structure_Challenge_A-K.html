<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viral Structure Challenge A–K</title><style>*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#eef8ff,#f7f0ff 55%,#fff6e9);color:#25364f}
.wrap{max-width:1050px;margin:auto;padding:15px}
.hero{background:linear-gradient(120deg,#17265f,#684bb8,#b54e91);color:#fff;border-radius:22px;padding:21px;text-align:center}
.hero h1{margin:0;font-size:clamp(25px,4vw,39px)}.hero p{margin:6px 0 0;color:#ffe58d;font-weight:800}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.pill{background:#fff;border-radius:999px;padding:8px 14px;font-weight:850;box-shadow:0 2px 8px #0001}

.case{font-size:19px;font-weight:950;color:#7256d8}.tag{font-size:11px;background:#eef3ff;color:#5260a0;padding:5px 9px;border-radius:99px;font-weight:900}
.visual{margin:12px auto;max-width:650px;background:#f8fbff;border:1px solid #e0e7ef;border-radius:16px;padding:8px}.visual svg{display:block;width:100%}
.clues{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.clue{background:#f5f7fb;border-radius:10px;padding:9px;text-align:center;font-size:13px;line-height:1.35}
.label{margin:14px 0 7px;font-size:14px;font-weight:900}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:2px solid #dde5ee;background:#fff;border-radius:12px;padding:11px;text-align:left;font-weight:750;cursor:pointer}.opt.selected{border-color:#7256d8;background:#f0edff}
.opt.correct{border-color:#55a56e;background:#ecf8f0}.opt.wrong{border-color:#d25d69;background:#fff0f2}
.submit,.next,.restart{width:100%;border:0;border-radius:12px;padding:12px;margin-top:13px;background:#7256d8;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.next{display:none}
.fb{display:none;margin-top:12px;padding:13px;border-radius:12px;background:#f5f7fb;line-height:1.55}.fb.show{display:block}
.final{text-align:center;padding:28px}.big{font-size:58px;color:#7256d8;font-weight:950}.final table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}.final th,.final td{border:1px solid #dde4ee;padding:7px;text-align:left}.final th{background:#f1f4fb}
.note{text-align:center;font-size:12px;color:#6c7789;margin-top:9px}@media(max-width:650px){.clues,.opts{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><div class="wrap">
<section class="hero"><h1>🦠 VIRAL STRUCTURE CHALLENGE A–K</h1><p>Analyze genome • capsid • envelope • morphology • size → identify the Family + Example</p></section>

<div class="note">ภาพเป็น simplified schematic ที่สร้างใหม่จากคุณลักษณะในเอกสาร ไม่ใช่ภาพต้นฉบับ A–K</div></div>
<script>

 papillomavirus"]; const SVG={"A": "<svg viewBox=\"0 0 500 180\"><circle cx=\"250\" cy=\"100\" r=\"70\" fill=\"#dfcf97\" stroke=\"#56657a\" stroke-width=\"5\"/><path d=\"M205 80c25 15 65 15 90 0M205 120c25-15 65-15 90 0\" fill=\"none\" stroke=\"#7255a8\" stroke-width=\"7\"/><g fill=\"#905bb8\"><circle cx=\"190\" cy=\"60\" r=\"7\"/><circle cx=\"210\" cy=\"42\" r=\"7\"/><circle cx=\"240\" cy=\"32\" r=\"7\"/><circle cx=\"270\" cy=\"32\" r=\"7\"/><circle cx=\"300\" cy=\"42\" r=\"7\"/><circle cx=\"320\" cy=\"60\" r=\"7\"/><circle cx=\"320\" cy=\"140\" r=\"7\"/><circle cx=\"300\" cy=\"158\" r=\"7\"/><circle cx=\"270\" cy=\"168\" r=\"7\"/><circle cx=\"240\" cy=\"168\" r=\"7\"/><circle cx=\"210\" cy=\"158\" r=\"7\"/><circle cx=\"190\" cy=\"140\" r=\"7\"/></g><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • A</text></svg>", "B": "<svg viewBox=\"0 0 500 180\"><circle cx=\"250\" cy=\"100\" r=\"70\" fill=\"#dfcf97\" stroke=\"#56657a\" stroke-width=\"5\"/><path d=\"M205 80c25 15 65 15 90 0M205 120c25-15 65-15 90 0\" fill=\"none\" stroke=\"#7255a8\" stroke-width=\"7\"/><g fill=\"#905bb8\"><circle cx=\"190\" cy=\"60\" r=\"7\"/><circle cx=\"210\" cy=\"42\" r=\"7\"/><circle cx=\"240\" cy=\"32\" r=\"7\"/><circle cx=\"270\" cy=\"32\" r=\"7\"/><circle cx=\"300\" cy=\"42\" r=\"7\"/><circle cx=\"320\" cy=\"60\" r=\"7\"/><circle cx=\"320\" cy=\"140\" r=\"7\"/><circle cx=\"300\" cy=\"158\" r=\"7\"/><circle cx=\"270\" cy=\"168\" r=\"7\"/><circle cx=\"240\" cy=\"168\" r=\"7\"/><circle cx=\"210\" cy=\"158\" r=\"7\"/><circle cx=\"190\" cy=\"140\" r=\"7\"/></g><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • B</text></svg>", "C": "<svg viewBox=\"0 0 500 180\"><polygon points=\"250,38 325,80 325,120 250,162 175,120 175,80\" fill=\"#82b9da\" stroke=\"#56657a\" stroke-width=\"5\"/><polygon points=\"250,62 300,88 300,112 250,138 200,112 200,88\" fill=\"#e4c46f\" stroke=\"#7255a8\" stroke-width=\"4\"/><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • C</text></svg>", "D": "<svg viewBox=\"0 0 500 180\"><rect x=\"135\" y=\"55\" width=\"230\" height=\"90\" rx=\"28\" fill=\"#b9cdbd\" stroke=\"#56657a\" stroke-width=\"5\"/><rect x=\"170\" y=\"78\" width=\"160\" height=\"44\" rx=\"15\" fill=\"#e2b17f\"/><path d=\"M195 92h110M195 108h110\" stroke=\"#6f50a5\" stroke-width=\"7\"/><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • D</text></svg>", "E": "<svg viewBox=\"0 0 500 180\"><polygon points=\"250,38 325,80 325,120 250,162 175,120 175,80\" fill=\"#82b9da\" stroke=\"#56657a\" stroke-width=\"5\"/><polygon points=\"250,62 300,88 300,112 250,138 200,112 200,88\" fill=\"#e4c46f\" stroke=\"#7255a8\" stroke-width=\"4\"/><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • E</text></svg>", "F": "<svg viewBox=\"0 0 500 180\"><circle cx=\"250\" cy=\"100\" r=\"70\" fill=\"#dfcf97\" stroke=\"#56657a\" stroke-width=\"5\"/><path d=\"M205 80c25 15 65 15 90 0M205 120c25-15 65-15 90 0\" fill=\"none\" stroke=\"#7255a8\" stroke-width=\"7\"/><g fill=\"#905bb8\"><circle cx=\"190\" cy=\"60\" r=\"7\"/><circle cx=\"210\" cy=\"42\" r=\"7\"/><circle cx=\"240\" cy=\"32\" r=\"7\"/><circle cx=\"270\" cy=\"32\" r=\"7\"/><circle cx=\"300\" cy=\"42\" r=\"7\"/><circle cx=\"320\" cy=\"60\" r=\"7\"/><circle cx=\"320\" cy=\"140\" r=\"7\"/><circle cx=\"300\" cy=\"158\" r=\"7\"/><circle cx=\"270\" cy=\"168\" r=\"7\"/><circle cx=\"240\" cy=\"168\" r=\"7\"/><circle cx=\"210\" cy=\"158\" r=\"7\"/><circle cx=\"190\" cy=\"140\" r=\"7\"/></g><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • F</text></svg>", "G": "<svg viewBox=\"0 0 500 180\"><ellipse cx=\"250\" cy=\"100\" rx=\"96\" ry=\"64\" fill=\"#b9d6aa\" stroke=\"#56657a\" stroke-width=\"5\"/><path d=\"M190 72c30 25 90 25 120 0M190 128c30-25 90-25 120 0\" fill=\"none\" stroke=\"#7255a9\" stroke-width=\"7\"/><path d=\"M175 65l-22-23M325 65l22-23M175 135l-22 23M325 135l22 23\" stroke=\"#dd7a5b\" stroke-width=\"7\"/><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • G</text></svg>", "H": "<svg viewBox=\"0 0 500 180\"><rect x=\"135\" y=\"62\" width=\"190\" height=\"76\" rx=\"38\" fill=\"#e4b59e\" stroke=\"#56657a\" stroke-width=\"5\"/><path d=\"M325 62l55 38-55 38z\" fill=\"#ce8c72\" stroke=\"#56657a\" stroke-width=\"5\"/><path d=\"M155 85h140M165 110h120\" stroke=\"#7054a9\" stroke-width=\"7\"/><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • H</text></svg>", "I": "<svg viewBox=\"0 0 500 180\"><circle cx=\"250\" cy=\"100\" r=\"70\" fill=\"#e7a9b7\" stroke=\"#56657a\" stroke-width=\"5\"/><polygon points=\"250,48 306,135 194,135\" fill=\"#7355a9\"/><circle cx=\"225\" cy=\"78\" r=\"7\" fill=\"white\"/><circle cx=\"278\" cy=\"84\" r=\"7\" fill=\"white\"/><path d=\"M165 70l-35-25M335 70l35-25M165 154l-35 20M335 154l35 20\" stroke=\"#5d91ba\" stroke-width=\"8\"/><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • I</text></svg>", "J": "<svg viewBox=\"0 0 500 180\"><circle cx=\"250\" cy=\"100\" r=\"63\" fill=\"#e7d09a\" stroke=\"#56657a\" stroke-width=\"5\"/><path d=\"M215 80c20 12 45 35 70 52M215 130c22-30 45-42 70-55\" fill=\"none\" stroke=\"#7352a5\" stroke-width=\"7\"/><line x1=\"312.0\" y1=\"100.0\" x2=\"342.0\" y2=\"100.0\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"303.7\" y1=\"131.0\" x2=\"329.7\" y2=\"146.0\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"281.0\" y1=\"153.7\" x2=\"296.0\" y2=\"179.7\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"250.0\" y1=\"162.0\" x2=\"250.0\" y2=\"192.0\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"219.0\" y1=\"153.7\" x2=\"204.0\" y2=\"179.7\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"196.3\" y1=\"131.0\" x2=\"170.3\" y2=\"146.0\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"188.0\" y1=\"100.0\" x2=\"158.0\" y2=\"100.0\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"196.3\" y1=\"69.0\" x2=\"170.3\" y2=\"54.0\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"219.0\" y1=\"46.3\" x2=\"204.0\" y2=\"20.3\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"250.0\" y1=\"38.0\" x2=\"250.0\" y2=\"8.0\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"281.0\" y1=\"46.3\" x2=\"296.0\" y2=\"20.3\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><line x1=\"303.7\" y1=\"69.0\" x2=\"329.7\" y2=\"54.0\" stroke=\"#dc7c5c\" stroke-width=\"8\"/><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • J</text></svg>", "K": "<svg viewBox=\"0 0 500 180\"><polygon points=\"250,38 325,80 325,120 250,162 175,120 175,80\" fill=\"#82b9da\" stroke=\"#56657a\" stroke-width=\"5\"/><polygon points=\"250,62 300,88 300,112 250,138 200,112 200,88\" fill=\"#e4c46f\" stroke=\"#7255a8\" stroke-width=\"4\"/><text x=\"250\" y=\"173\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"#5e6b7d\">SIMPLIFIED STRUCTURAL SCHEMATIC • K</text></svg>"};
let i=0,score=0,full=0,selF="",selE="",answered=false;
const $=id=>document.getElementById(id); const shuffle=a=>a.sort(()=>Math.random()-.5);
function opts(correct,all){let a=shuffle([...all].filter(x=>x!==correct)).slice(0,3);a.push(correct);return shuffle(a)}
function render(){
 answered=false;selF="";selE="";const q=BANK[i],fs=opts(q[1],FAMS),es=opts(q[2],EXS);
 $("num").textContent=i+1;$("score").textContent=score;$("full").textContent=full;$("bar").style.width=(i/BANK.length*100)+"%";
 $("stage").innerHTML='<div class="card"><div class="top"><span class="case">UNKNOWN VIRUS '+q[0]+'</span><span class="tag">Case '+(i+1)+' / 11</span></div>'+
 '<div class="visual">'+SVG[q[0]]+'</div><div class="clues"><div class="clue"><b>Genome</b><br>'+q[3]+'</div><div class="clue"><b>Capsid</b><br>'+q[4]+'</div><div class="clue"><b>Envelope</b><br>'+q[5]+'</div><div class="clue"><b>Shape</b><br>'+q[6]+'</div><div class="clue"><b>Size</b><br>'+q[7]+'</div><div class="clue"><b>Key clue</b><br>'+q[8]+'</div></div>'+
 '<div class="label">1) Select the virus family</div><div class="opts" id="fopts">'+fs.map(x=>'<button type="button" class="opt" data-f="'+x+'">'+x+'</button>').join('')+'</div>'+
 '<div class="label">2) Give an example virus from that family</div><div class="opts" id="eopts">'+es.map(x=>'<button type="button" class="opt" data-e="'+x+'">'+x+'</button>').join('')+'</div>'+
 '<button type="button" class="submit" id="submit">Check answer</button><div id="fb" class="fb"></div><button type="button" class="next" id="next">'+(i===BANK.length-1?'View final score':'Next case →')+'</button></div>';
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{if(answered)return;selF=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});
 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{if(answered)return;selE=b.dataset.e;document.querySelectorAll("[data-e]").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});
 $("submit").onclick=check;$("next").onclick=()=>{i++;if(i<BANK.length)render();else finish()};
}
function check(){
 if(!selF||!selE)return;answered=true;const q=BANK[i],okF=selF===q[1],okE=selE===q[2];if(okF)score++;if(okE)score++;if(okF&&okE)full++;
 $("score").textContent=score;$("full").textContent=full;
 document.querySelectorAll("[data-f]").forEach(b=>{b.disabled=true;if(b.dataset.f===q[1])b.classList.add("correct");else if(b.dataset.f===selF)b.classList.add("wrong")});
 document.querySelectorAll("[data-e]").forEach(b=>{b.disabled=true;if(b.dataset.e===q[2])b.classList.add("correct");else if(b.dataset.e===selE)b.classList.add("wrong")});
 const fb=$("fb");fb.className="fb show";fb.innerHTML="<b>"+(okF?"✅ Family correct":"❌ Family incorrect")+" &nbsp; "+(okE?"✅ Example correct":"❌ Example incorrect")+"</b><br><br><b>Correct answer:</b> "+q[1]+" — "+q[2]+"<br><b>Structural reasoning:</b> "+q[3]+"; "+q[4]+"; "+q[5]+"; "+q[6]+"; "+q[7]+"; "+q[8];
 $("submit").style.display="none";$("next").style.display="block";
}
function finish(){
 $("bar").style.width="100%";
 $("stage").innerHTML='<div class="card final"><div class="big">🏆 '+score+'/22</div><h2>Challenge Complete</h2><p>Fully correct cases: <b>'+full+'/11</b></p><table><tr><th>Case</th><th>Family</th><th>Example</th></tr>'+BANK.map(q=>'<tr><td>'+q[0]+'</td><td>'+q[1]+'</td><td>'+q[2]+'</td></tr>').join('')+'</table><button class="restart" id="restart">↻ Play again</button></div>';
 $("restart").onclick=()=>{i=0;score=0;full=0;render()};
}
render();
</script></body></html>
